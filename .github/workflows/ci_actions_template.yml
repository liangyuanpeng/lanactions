name: ci_actions

on:
  workflow_call:
    inputs:
      trigger_issue_id:
        description: 'issueId'
        required: false
        type: string
      custom_param:
        description: 'customParam'
        required: false
        type: string
      gh_event:
        description: 'ghevent'
        required: false
        type: string
      ci_name:
        description: 'ci name'
        required: false
        type: string
        default: 'build'
      job_name:
        description: 'job name'
        required: false
        type: string
        default: 'build'

jobs:
  ci_job:
    name: ${{ inputs.job_name || 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GHEVENT: ${{ inputs.gh_event }}
      CINAME: ${{ inputs.ci_name || 'build' }}
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write

    steps:
    - name: Set up JDK
      id: setup-java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
    - uses: actions/setup-go@main
      with:
        go-version: '1.23'
    - uses: oras-project/setup-oras@main
      with:
        version: 1.2.0

    - name: build
      run: |
        oras login -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io
        oras pull ghcr.io/liangyuanpeng/lanfiles:jobs-ci
        chmod +x job.sh
        ./job.sh
