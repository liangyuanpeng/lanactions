              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Download failed, retrying in 5s..."
              sleep 5
            fi
          done
          if [ ! -f "${ORAS_TARBALL}" ]; then
            echo "ERROR: Failed to download ${ORAS_TARBALL} after 3 attempts"
            exit 1
          fi
          tar -xzf "${ORAS_TARBALL}"
          chmod +x oras
          mv oras /usr/local/bin/oras
          oras version
      - uses: actions/setup-go@main
        
      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: "temurin"
      # - name: 🤖 Setup Android SDK
