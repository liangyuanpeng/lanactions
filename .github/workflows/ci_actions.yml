name: ci_actions

on:
  workflow_dispatch:
    inputs:
      triggerIssueId:
        description: "issueId"
        required: false
      customParam:
        description: "customParam"
        required: false
      ghevent:
        description: "ghevent"
        required: false
      ciname:
        description: "ghevent"
        required: false

jobs:
  # 动态生成 job 配置的 setup job
  setup:
    runs-on: ubuntu-latest
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: setup
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      ci-matrix: ${{ steps.set-matrix.outputs.ci-matrix }}
      always-jobs: ${{ steps.set-matrix.outputs.always-jobs }}
      multi-field-matrix: ${{ steps.set-matrix.outputs.multi-field-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史来检测变更

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0
      - name: Generate dynamic matrix
        id: set-matrix
        run: |
          # 使用智能脚本生成动态配置
          chmod +x scripts/smart-ci-matrix.sh
          ./scripts/smart-ci-matrix.sh "${{ github.event.inputs.ghevent || 'standard' }}" "${{ github.event.inputs.customParam }}"
          oras login -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io
          oras pull ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh
          echo "$GITHUB_OUTPUT"

  # 动态基础 jobs (build, e2e 等)
  basic-jobs:
    runs-on: ${{ matrix.runson }}
    timeout-minutes: 120
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        # job: ${{ fromJSON(needs.setup.outputs.matrix) }}
        # 从 setup 步骤输出的多字段 JSON 中读取数据
        include: ${{ fromJSON(needs.setup.outputs.multi-field-matrix ) }}
    # name: ${{ matrix.job }}
    name: ${{ matrix.job_type }}-${{ matrix.env }}-node${{ matrix.node_version }}-${{ matrix.runson }}
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      # CINAME: ${{ matrix.job }}
      CINAME: ${{ matrix.job_type }}
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      # - name: Set up JDK
      #   id: setup-java
      #   uses: actions/setup-java@v4
      #   with:
      #     java-version: 21
      #     distribution: "temurin"
      - uses: actions/setup-go@main
        # with:
        #   go-version: "1.23"
      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 安装必要的 Android SDK 组件 (使用空格分隔)
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run job
        run: |
          echo "hello"
          echo "ciname:"${CINAME}
          oras login -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io
          oras pull ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: build
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
      - uses: actions/setup-go@main
        # with:
          # go-version: "1.23"
      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0
      # - name: Setup Android
      #   uses: android-actions/setup-android@v3
      #   with:
      #     api-level: 34
      #     ndk-version: '27.3.13750724'
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 安装必要的 Android SDK 组件 (使用空格分隔)
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache: 'npm'
      - name: build
        run: |
          oras login -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io
          oras pull ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: tests
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
      - uses: actions/setup-go@main
        # with:
          # go-version: "1.23"
      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0
      - name: build
        run: |
          oras login -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io
          oras pull ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: e2e
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
      - uses: actions/setup-go@main
        # with:
          # go-version: "1.23"
      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0

      - name: build
        run: |
          oras login -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io
          oras pull ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh

  #TODO 动态一个job
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write
    needs:
      - basic-jobs
    steps:
      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
      - uses: actions/setup-go@main
        
      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0

      - name: trivy
        env:
          GHEVENT: ${{ github.event.inputs.ghevent }}
          CINAME: trivy
          GH_TOKEN: ${{ github.token }}
          CURRENT_GHEVENT: ${{ toJSON(github.event) }}
        run: |
          oras pull -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh

  # 动态 CI matrix jobs
  ci:
    runs-on: ${{ matrix.runasos }}
    timeout-minutes: 120
    needs: setup
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: ci
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
      JAVA_VERSION: ${{ matrix.java_version }}
      CI_PROFILE: ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.ci-matrix) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0
      - uses: actions/setup-go@main
        
      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: "temurin"
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 安装必要的 Android SDK 组件 (使用空格分隔)
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ci
        run: |
          oras login -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io
          oras pull -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh

  # 动态 always jobs
  alwaysjob:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: always()
    needs:
      - setup
      - basic-jobs
      - ci
      - trivy
      - build
      - e2e
    strategy:
      fail-fast: false
      matrix:
        CINAME: ${{ fromJSON(needs.setup.outputs.always-jobs) }}
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: ${{ matrix.CINAME }}
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - uses: actions/setup-go@main
        

      - uses: oras-project/setup-oras@main
        with:
          version: 1.2.0

      - name: Run always job
        run: |
          oras pull -uliangyuanpeng -p${{ secrets.GITHUB_TOKEN }} ghcr.io/liangyuanpeng/lanfiles:jobs-ci
          chmod +x job.sh
          ./job.sh
